<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Routes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Work Around</div>
            <div class="right"><button id="add-new-task"><i class="fa fa-plus-circle"></i> Add New Task</button></div>
        </nav>
        <section class="board">
            <div class="task-columns" id="To-do">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                <!-- <div draggable="true" class="task">  
                    <h2>Task 1</h2>
                    <p>Description For Task 1</p>
                    <button><i class="fa fa-trash"></i> Delete</button>
                </div> -->
            </div>
            <div class="task-columns" id="In-progress">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div class="task-columns" id="Done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="Task Title">
            <textarea placeholder="Task Description" rows="4" ></textarea>
            <button id="add-task"><i class="fa fa-plus-circle"></i>Add Task</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
